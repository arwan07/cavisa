# Konfigurasi Nginx Produksi untuk CAVISA Frontend + Reverse Proxy Backend
# Dapat digunakan langsung di Docker Nginx maupun Nginx Server Fisik/VPS (Ubuntu/Debian)

server {
    listen 80;
    server_name localhost;

    # Batas ukuran unggah citra mikroskopis (sesuai MAX_UPLOAD_MB di backend)
    client_max_body_size 25M;

    # Root direktori berkas Frontend
    root /usr/share/nginx/html;
    index index.html;

    # --- Optimasi & Kompresi ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --- Security Headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Routing Halaman Statis Frontend ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Halaman Admin Khusus
    location /admin {
        try_files $uri $uri/ /admin.html;
    }

    # Cache untuk aset statis (CSS, JS, Fonts, Images)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # --- Reverse Proxy ke Backend FastAPI ---
    # Di Docker: backend:8000
    # Di VPS Standalone: ubah backend:8000 menjadi 127.0.0.1:8000
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
